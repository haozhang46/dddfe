name: affected-test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/check-nx-affected.mjs
      - run: pnpm exec nx affected:test --base=${{ github.event.pull_request.base.sha }} --head=${{ github.sha }}
        env:
          NX_DAEMON: "false"
          CI: "true"
