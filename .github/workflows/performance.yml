name: performance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Install demo
        run: pnpm install --dir templates/demo --ignore-workspace --frozen-lockfile

      - name: Bundle size budget
        run: pnpm verify:bundle

      - name: Build demo
        run: pnpm --dir templates/demo build

      - name: Install Chromium (Playwright + Lighthouse)
        run: pnpm exec playwright install --with-deps chromium

      - name: Preview demo
        run: |
          pnpm --dir templates/demo exec vite preview --host 127.0.0.1 --port 4173 &
          echo $! > /tmp/vite-preview.pid
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:4173/ >/dev/null; then
              echo "preview ready"
              exit 0
            fi
            sleep 1
          done
          echo "preview failed to become ready" >&2
          exit 1

      - name: Runtime + Lighthouse
        env:
          CI: "true"
          RUNTIME_REPORT_PATH: ./runtime-report.json
        run: |
          export CHROME_PATH="$(pnpm exec tsx -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")"
          echo "CHROME_PATH=$CHROME_PATH"
          test -n "$CHROME_PATH" && test -x "$CHROME_PATH"
          pnpm exec tsx scripts/tools/runtime-inspector.ts http://127.0.0.1:4173 --lighthouse

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-report
          path: |
            runtime-report.json
            runtime-report-*.json
          if-no-files-found: ignore

      - name: Comment PR
        if: always() && hashFiles('runtime-report.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('runtime-report.json', 'utf8'));
            const lh = report.lighthouse || {};
            const perf = report.performance || {};
            const score = (n) => (typeof n === 'number' ? n.toFixed(0) : 'n/a');
            const ms = (n) => (typeof n === 'number' ? `${Math.round(n)}ms` : 'n/a');
            const ok = (cond) => (cond ? '✅' : '❌');
            const body = [
              '## Performance Report',
              '',
              '| Metric | Value | Status |',
              '|--------|-------|--------|',
              `| Lighthouse Performance | ${score(lh.performance)}/100 | ${ok((lh.performance ?? 0) >= 50)} |`,
              `| Lighthouse Accessibility | ${score(lh.accessibility)}/100 | ${ok((lh.accessibility ?? 0) >= 50)} |`,
              `| LCP | ${ms(perf.LCP ?? lh.metrics?.largestContentfulPaint)} | ${ok(((perf.LCP ?? lh.metrics?.largestContentfulPaint) ?? Infinity) < 4000)} |`,
              `| CLS | ${perf.CLS ?? lh.metrics?.cumulativeLayoutShift ?? 'n/a'} | ${ok(((perf.CLS ?? lh.metrics?.cumulativeLayoutShift) ?? Infinity) < 0.25)} |`,
              `| Console errors | ${(report.errors || []).length} | ${ok((report.errors || []).length === 0)} |`,
              '',
              '_Artifact: `runtime-report` on this workflow run._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const marker = '## Performance Report';
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Stop preview
        if: always()
        run: |
          if [ -f /tmp/vite-preview.pid ]; then
            kill "$(cat /tmp/vite-preview.pid)" || true
          fi
